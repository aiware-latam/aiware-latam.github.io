  const NS = 'http://www.w3.org/2000/svg';
  const BRANCH_VARS = ['--branch-1', '--branch-2', '--branch-3', '--branch-4', '--branch-5', '--branch-6'];

  const COL_WIDTH = 280;
  const LEFT_X = 26;
  const HUB_GAP = 46;
  const TOP_MARGIN = 40;
  const BOTTOM_MARGIN = 40;
  const BLOCK_GAP = 34;
  const TITLE_LH = 22;
  const BULLET_LH = 19;
  const GAP_TITLE_BULLETS = 8;
  const GAP_BETWEEN_BULLETS = 5;
  const TITLE_FS = 15.5;
  const BULLET_FS = 13.5;

  function wrapByWidth(measure, text, cls, maxWidth) {
    const words = text.split(' ');
    const lines = [];
    let cur = '';
    words.forEach(w => {
      const test = cur ? cur + ' ' + w : w;
      if (cur && measure(test, cls) > maxWidth) {
        lines.push(cur);
        cur = w;
      } else {
        cur = test;
      }
    });
    if (cur) lines.push(cur);
    return lines;
  }

  function layoutBlock(measure, topic, colorVar) {
    const titleText = topic.emoji + '  ' + topic.title.toUpperCase();
    const titleLines = wrapByWidth(measure, titleText, 'mm-branch-title', COL_WIDTH);

    const bulletGroups = topic.bullets.map(b => wrapByWidth(measure, b, 'mm-bullet-text', COL_WIDTH - 20));

    const entries = [];
    let y = 0;
    titleLines.forEach((line, i) => {
      y += TITLE_LH;
      entries.push({ text: line, cls: 'mm-branch-title', color: colorVar, y, indent: 0 });
    });
    y += GAP_TITLE_BULLETS - TITLE_LH + TITLE_LH; // reset baseline offset handled below
    y -= TITLE_LH; // correction: recompute cleanly
    // recompute cleanly to avoid confusion
    y = titleLines.length * TITLE_LH + GAP_TITLE_BULLETS;

    bulletGroups.forEach((lines, bi) => {
      lines.forEach((line, li) => {
        y += BULLET_LH;
        const displayText = li === 0 ? '↳ ' + line : line;
        entries.push({ text: displayText, cls: 'mm-bullet-text', color: null, y, indent: 14 });
      });
      if (bi < bulletGroups.length - 1) y += GAP_BETWEEN_BULLETS;
    });

    return { entries, height: y, titleLineCount: titleLines.length };
  }

  function buildMindMap(container, theme) {
    const svg = document.createElementNS(NS, 'svg');
    svg.setAttribute('role', 'img');
    const flatTopics = theme.topics.map(t => t.title).join('; ');
    svg.setAttribute('aria-label', theme.center + ': ' + flatTopics);
    container.appendChild(svg);

    // measurer
    const measurer = document.createElementNS(NS, 'text');
    measurer.setAttribute('x', -9999);
    measurer.setAttribute('y', -9999);
    svg.appendChild(measurer);
    const measure = (str, cls) => {
      measurer.setAttribute('class', cls);
      measurer.textContent = str;
      return measurer.getComputedTextLength();
    };

    const leftTopics = theme.topics.slice(0, 3);
    const rightTopics = theme.topics.slice(3, 6);

    const leftBlocks = leftTopics.map((t, i) => layoutBlock(measure, t, `var(${BRANCH_VARS[i]})`));
    const rightBlocks = rightTopics.map((t, i) => layoutBlock(measure, t, `var(${BRANCH_VARS[i + 3]})`));

    const leftTotal = leftBlocks.reduce((s, b) => s + b.height, 0) + BLOCK_GAP * (leftBlocks.length - 1);
    const rightTotal = rightBlocks.reduce((s, b) => s + b.height, 0) + BLOCK_GAP * (rightBlocks.length - 1);
    const contentHeight = Math.max(leftTotal, rightTotal, 300);
    const H = TOP_MARGIN + BOTTOM_MARGIN + contentHeight;
    const CENTER_Y = TOP_MARGIN + contentHeight / 2;

    // center title (measure + possibly wrap to 2 lines)
    let centerFS = 40;
    let centerLines = [theme.center];
    const w1 = measure(theme.center, 'mm-center-measure');
    if (w1 > 300) {
      const parts = theme.center.split(' ');
      if (parts.length > 1) {
        const mid = Math.ceil(parts.length / 2);
        centerLines = [parts.slice(0, mid).join(' '), parts.slice(mid).join(' ')];
      } else {
        centerFS = 30;
      }
    }
    const centerWidths = centerLines.map(l => measure(l, 'mm-center-measure'));
    const centerHalfWidth = Math.max(...centerWidths) / 2;
    const centerLineHeight = centerFS * 0.95;
    const centerBlockHeight = centerLines.length * centerLineHeight;
    const padTop = centerFS * 0.4;
    const padBottom = centerFS * 0.22;
    const padX = 22;
    const rectW = centerHalfWidth * 2 + padX * 2;
    const rectH = centerBlockHeight + padTop + padBottom;
    const rectHalfWidth = rectW / 2;

    // geometry derives from the hub's actual width so the card never
    // collides with the topic columns, whatever the center label's length
    const LEFT_COL_RIGHT = LEFT_X + COL_WIDTH;
    const CENTER_X = LEFT_COL_RIGHT + HUB_GAP + rectHalfWidth;
    const RIGHT_X = CENTER_X + rectHalfWidth + HUB_GAP;
    const W = RIGHT_X + COL_WIDTH + LEFT_X;

    const rectX = CENTER_X - rectHalfWidth;
    const rectY = CENTER_Y - rectH / 2;

    svg.setAttribute('viewBox', `0 0 ${W} ${H}`);

    function renderColumn(blocks, startY, colX, isRight) {
      let y = startY;
      blocks.forEach((block, idx) => {
        const blockTop = y;
        const blockMidY = blockTop + block.height / 2;

        block.entries.forEach(entry => {
          const t = document.createElementNS(NS, 'text');
          t.setAttribute('x', colX + entry.indent);
          t.setAttribute('y', blockTop + entry.y);
          t.setAttribute('class', entry.cls);
          if (entry.color) t.setAttribute('style', 'fill:' + entry.color);
          t.textContent = entry.text;
          svg.appendChild(t);
        });

        // arrow from center to this block
        const rowFactor = idx - (blocks.length - 1) / 2;
        const wiggle = rowFactor * 20;
        const startPt = { x: CENTER_X + (isRight ? 1 : -1) * (rectHalfWidth + 12), y: CENTER_Y };
        const gapEndX = isRight ? colX - 24 : colX + COL_WIDTH + 24;
        const endPt = { x: gapEndX, y: blockMidY };
        const c1 = { x: startPt.x + (endPt.x - startPt.x) * 0.35, y: startPt.y + wiggle };
        const c2 = { x: startPt.x + (endPt.x - startPt.x) * 0.72, y: endPt.y - wiggle * 0.5 };

        const dirX = endPt.x - c2.x, dirY = endPt.y - c2.y;
        const dirLen = Math.hypot(dirX, dirY) || 1;
        const ux = dirX / dirLen, uy = dirY / dirLen;
        const arrowLen = 13, arrowW = 9;
        const tipX = endPt.x, tipY = endPt.y;
        const baseX = tipX - ux * arrowLen, baseY = tipY - uy * arrowLen;
        const perpX = -uy, perpY = ux;
        const leftX = baseX + perpX * (arrowW / 2), leftY = baseY + perpY * (arrowW / 2);
        const rightX2 = baseX - perpX * (arrowW / 2), rightY2 = baseY - perpY * (arrowW / 2);

        const path = document.createElementNS(NS, 'path');
        path.setAttribute('d', `M ${startPt.x} ${startPt.y} C ${c1.x} ${c1.y}, ${c2.x} ${c2.y}, ${baseX} ${baseY}`);
        path.setAttribute('class', 'mm-arrow');
        path.setAttribute('style', 'stroke:' + block.entries[0].color);
        //svg.insertBefore(path, svg.firstChild.nextSibling);

        const tri = document.createElementNS(NS, 'polygon');
        tri.setAttribute('points', `${tipX},${tipY} ${leftX},${leftY} ${rightX2},${rightY2}`);
        tri.setAttribute('style', 'fill:' + block.entries[0].color);
        //svg.insertBefore(tri, path.nextSibling);

        y += block.height + BLOCK_GAP;
      });
    }

    const leftStartY = TOP_MARGIN + (contentHeight - leftTotal) / 2;
    const rightStartY = TOP_MARGIN + (contentHeight - rightTotal) / 2;
    renderColumn(leftBlocks, leftStartY, LEFT_X, false);
    renderColumn(rightBlocks, rightStartY, RIGHT_X, true);

    // center label patch (drawn last, on top of arrows so the spine lines
    // read as touching the hub card rather than crossing the lettering)
    const hubRect = document.createElementNS(NS, 'rect');
    hubRect.setAttribute('x', rectX);
    hubRect.setAttribute('y', rectY);
    hubRect.setAttribute('width', rectW);
    hubRect.setAttribute('height', rectH);
    hubRect.setAttribute('rx', 14);
    hubRect.setAttribute('class', 'mm-hub');
    //svg.appendChild(hubRect);

    let cy0 = CENTER_Y - centerBlockHeight / 2 + centerLineHeight * 0.78;
    centerLines.forEach(line => {
      const t = document.createElementNS(NS, 'text');
      t.setAttribute('x', CENTER_X);
      t.setAttribute('y', cy0);
      t.setAttribute('text-anchor', 'middle');
      t.setAttribute('class', 'mm-center-text');
      t.setAttribute('style', 'font-size:' + centerFS + 'px');
      t.textContent = line;
      svg.appendChild(t);
      cy0 += centerLineHeight;
    });

    // wavy underline flourish just beneath the hub card
    const underlineY = rectY + rectH + 9;
    const halfW = rectHalfWidth - 10;
    let d = `M ${CENTER_X - halfW} ${underlineY} `;
    const segs = 5;
    for (let i = 1; i <= segs; i++) {
      const x = CENTER_X - halfW + (2 * halfW / segs) * i;
      const prevX = CENTER_X - halfW + (2 * halfW / segs) * (i - 1);
      const midX = (x + prevX) / 2;
      const dir = i % 2 === 0 ? 1 : -1;
      d += `Q ${midX} ${underlineY + dir * 5}, ${x} ${underlineY} `;
    }
    const underline = document.createElementNS(NS, 'path');
    underline.setAttribute('d', d);
    underline.setAttribute('class', 'mm-underline');
    svg.appendChild(underline);

    measurer.remove();
  }

  document.fonts.ready.then(() => {
    const stack = document.getElementById('stack');
    THEMES.forEach(theme => {
      const card = document.createElement('article');
      card.className = 'card';

      const head = document.createElement('div');
      head.className = 'card-head';
      const eyebrow = document.createElement('div');
      eyebrow.className = 'eyebrow';
      eyebrow.textContent = theme.code;
      const h2 = document.createElement('h2');
      h2.textContent = theme.center;
      const sourceTitle = document.createElement('p');
      //sourceTitle.className = 'source-title';
      sourceTitle.className = 'eyebrowT';
      sourceTitle.textContent = theme.title;
      head.appendChild(eyebrow);
      //head.appendChild(h2);
      head.appendChild(sourceTitle);

      const figure = document.createElement('figure');
      figure.className = 'mindmap';
      const figcaption = document.createElement('figcaption');
      figcaption.className = 'sr-only';
      figcaption.hidden = true;
      figcaption.textContent = `Mapa mental do tema ${theme.code}: ${theme.center}`;

      card.appendChild(head);
      card.appendChild(figure);
      figure.appendChild(figcaption);
      stack.appendChild(card);

      buildMindMap(figure, theme);
    });

    // Groups two or more theme cards in a single dashed-border block.
    // Usage: groupThemes(['T1', 'T2'], 'Optional label') — pass the theme
    // codes (as written in the THEMES array above) you want bundled together.
    // Call it as many times as you like, with different code lists, right here.
    function groupThemes(codes, label) {
      const cards = codes
        .map(code => Array.from(stack.children).find(card => card.querySelector('.eyebrow')?.textContent === code))
        .filter(Boolean);

      const wrapper = document.createElement('div');
      wrapper.className = 'theme-group';
      if (label) wrapper.setAttribute('data-label', label);

      cards[0].before(wrapper);
      cards.forEach(card => wrapper.appendChild(card));
    }

    // Example — remove or edit freely:
    groupThemes(['Tema 1', 'Tema 2'], 'Pessoas e formação');
    groupThemes(['Tema 3', 'Tema 4'], 'Desenvolvimento e Qualidade');
    groupThemes(['Tema 5'], 'Evolução');
    groupThemes(['Tema 6', 'Tema 7'], 'Privacidade, Propriedade e Prompts');
    groupThemes(['Tema 8', 'Tema 9'], 'Engenharia e Adoção');
  });
</script>
